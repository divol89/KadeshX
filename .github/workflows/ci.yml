name: KadeshX CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: 1.18.0
  ANCHOR_VERSION: 0.29.0

jobs:
  lint-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install Solana
      run: |
        sh -c "$(curl -sSfL https://release.solana.com/v${SOLANA_VERSION}/install)"
        echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

    - name: Install Anchor
      run: |
        cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked

    - name: Run fmt check
      run: cargo fmt -- --check
      working-directory: ./programs/kadeshx

    - name: Run clippy
      run: cargo clippy -- -D warnings
      working-directory: ./programs/kadeshx

    - name: Build program
      run: anchor build
      working-directory: .

    - name: Run tests
      run: cargo test --lib
      working-directory: ./programs/kadeshx

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run cargo-audit
      uses: actions-rust-lang/audit@v1
      with:
        workingDirectory: ./programs/kadeshx

  soteria-scan:
    name: Soteria Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install Soteria
      run: |
        sh -c "$(curl -k https://supercompiler.xyz/install)"
        echo "$HOME/soteria-linux-develop/bin" >> $GITHUB_PATH

    - name: Run Soteria scan
      run: |
        soteria -analyzeAll .
      working-directory: ./programs/kadeshx
